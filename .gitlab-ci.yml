stages:
  - build
  - deploy

variables:
  PROD_USER: "ubuntu"
  # 🚨 1. 배포 경로를 우리가 실제 세팅한 폴더로 수정!
  PROD_APP_DIR: "/home/ubuntu/S14P21A205"

# ==========================================
# 1. Spring Boot (백엔드) 빌드
# ==========================================
build-backend:
  stage: build
  image: eclipse-temurin:17-jdk
  script:
    - cd backend # (주의: 실제 백엔드 폴더명이 다르면 수정하세요)
    - chmod +x ./gradlew
    - ./gradlew clean build -x test
  artifacts:
    expire_in: 1 days
    paths:
      - backend/build/libs/*.jar
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"' # 🚨 2. main을 master로 변경!

# ==========================================
# 2. 백엔드 배포 (Systemd 방식)
# ==========================================
deploy-backend:
  stage: deploy
  image: alpine:3.20
  needs:
    - build-backend
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$MAIN_SERVER_IP" >> ~/.ssh/known_hosts
  script:
    # 🚨 3. 빌드된 jar 파일을 app.jar 라는 이름으로 정확히 덮어쓰기!
    - scp backend/build/libs/*-SNAPSHOT.jar $PROD_USER@$MAIN_SERVER_IP:$PROD_APP_DIR/app.jar
    # 🚨 4. 도커 대신 우리가 아까 썼던 Systemd 재시작 명령어로 변경!!
    - ssh $PROD_USER@$MAIN_SERVER_IP "sudo systemctl restart S14P21A205"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"' # 🚨 main을 master로 변경!

# ==========================================
# 3. React (프론트엔드) 빌드 및 S3 배포
# ==========================================
build-deploy-frontend:
  stage: build
  image: node:18-alpine
  before_script:
    - apk add --no-cache aws-cli
  script:
    - cd frontend # (주의: 실제 프론트 폴더명이 다르면 수정하세요)
    - npm install
    - npm run build
    - aws s3 sync build/ s3://$S3_BUCKET_NAME --delete --region ap-northeast-2
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"' # 🚨 main을 master로 변경!
