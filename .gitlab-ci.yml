stages:
  - build
  - deploy

variables:
  PROD_USER: "ubuntu"
  PROD_APP_DIR: "/home/ubuntu/S14P21A205"

# ==========================================
# 1. Spring Boot (백엔드) 빌드
# ==========================================
build-backend:
  stage: build
  image: eclipse-temurin:17-jdk
  script:
    - cd S14P21A205_BE # 🚨 대장님의 진짜 백엔드 폴더명으로 맞춤!
    - chmod +x ./gradlew
    - ./gradlew clean build -x test
  artifacts:
    expire_in: 1 days
    paths:
      - S14P21A205_BE/build/libs/*.jar # 🚨 여기도 경로 맞춤!
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

# ==========================================
# 2. 백엔드 배포 (Systemd 방식)
# ==========================================
deploy-backend:
  stage: deploy
  image: alpine:3.20
  needs:
    - build-backend
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$MAIN_SERVER_IP" >> ~/.ssh/known_hosts
  script:
    # 🚨 파일 복사 경로도 대장님 폴더명으로 완벽하게 맞춤!
    - scp S14P21A205_BE/build/libs/*-SNAPSHOT.jar $PROD_USER@$MAIN_SERVER_IP:$PROD_APP_DIR/app.jar
    # 🚨 무적의 Systemd 재시작 명령어!
    - ssh $PROD_USER@$MAIN_SERVER_IP "sudo systemctl restart S14P21A205"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

