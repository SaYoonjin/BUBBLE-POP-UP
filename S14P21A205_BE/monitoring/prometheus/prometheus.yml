global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: spring-backend
    metrics_path: /actuator/prometheus
    scheme: https
    static_configs:
      - targets:
          - j14a205.p.ssafy.io

  # 다음 단계에서 node_exporter, cAdvisor 추가 시 사용
