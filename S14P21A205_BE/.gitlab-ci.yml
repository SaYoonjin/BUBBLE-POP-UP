stages:
  - build
  - deploy

variables:
  # 💡 변수명 세팅 (깃랩 Variables에 MAIN_SERVER_IP, SSH_PRIVATE_KEY, S3_BUCKET_NAME 이 있어야 함!)
  PROD_USER: "ubuntu"
  PROD_APP_DIR: "/home/ubuntu/my-project" # 아까 16기가 서버에 만든 도커 폴더!

# ==========================================
# 1. Spring Boot (백엔드) 빌드
# ==========================================
build-backend:
  stage: build
  image: eclipse-temurin:17-jdk
  script:
    - cd backend # 🚨 깃랩의 실제 백엔드 폴더명으로 수정 (예: backend)
    - chmod +x ./gradlew
    - ./gradlew clean build -x test
  artifacts:
    expire_in: 1 days
    paths:
      - backend/build/libs/*.jar
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ==========================================
# 2. 백엔드 도커(Docker)로 배포
# ==========================================
deploy-backend:
  stage: deploy
  image: alpine:3.20 # 가져오신 스크립트의 가볍고 빠른 이미지 채택!
  needs:
    - build-backend
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$MAIN_SERVER_IP" >> ~/.ssh/known_hosts
  script:
    # 1. 빌드된 jar 파일을 16GB 메인 서버의 my-project 폴더로 전송
    - scp backend/build/libs/*-SNAPSHOT.jar $PROD_USER@$MAIN_SERVER_IP:$PROD_APP_DIR/backend.jar
    # 2. 도커 컴포즈를 이용해 스프링부트 컨테이너만 재시작! (systemctl 아님!)
    - ssh $PROD_USER@$MAIN_SERVER_IP "cd $PROD_APP_DIR && docker compose restart spring-boot"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ==========================================
# 3. React (프론트엔드) 빌드 및 S3 배포
# ==========================================
build-deploy-frontend:
  stage: build # 프론트는 금방 끝나서 build 단계에서 S3로 바로 쏩니다.
  image: node:18-alpine
  before_script:
    - apk add --no-cache aws-cli
  script:
    - cd frontend # 🚨 깃랩의 실제 프론트엔드 폴더명으로 수정 (예: frontend)
    - npm install
    - npm run build
    # S3 버킷으로 빌드된 파일 덮어쓰기! (깃랩 변수에 AWS Key들이 있어야 작동)
    - aws s3 sync build/ s3://$S3_BUCKET_NAME --delete --region ap-northeast-2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
